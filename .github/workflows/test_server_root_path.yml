name: Test Proxy SERVER_ROOT_PATH Routing
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"

jobs:
  test-server-root-path:
    runs-on: ubuntu-latest
    # Backstop only. Every step that can stall carries its own cap below, so a
    # failure names the step that timed out instead of showing up as a bare
    # "cancelled" job 30 minutes later.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        root_path: ["/api/v1", "/llmproxy"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        timeout-minutes: 12
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          file: ./docker/Dockerfile.non_root
          tags: litellm-test:${{ github.sha }}
          load: true
          push: false

      - name: Start LiteLLM container with SERVER_ROOT_PATH
        run: |
          docker run -d \
            --name litellm-test \
            -p 4000:4000 \
            -e SERVER_ROOT_PATH="${{ matrix.root_path }}" \
            -e LITELLM_MASTER_KEY="sk-1234" \
            litellm-test:${{ github.sha }} \
            --detailed_debug

      - name: Wait for container to be healthy
        run: |
          echo "Waiting for LiteLLM to start..."
          max_attempts=30
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            if docker logs litellm-test 2>&1 | grep -q "Uvicorn running"; then
              echo "LiteLLM started successfully"
              break
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts - waiting for server to start..."
            sleep 2
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to start within timeout"
            docker logs litellm-test
            exit 1
          fi

          sleep 5

      - name: Show container logs
        if: always()
        run: docker logs litellm-test

      - name: Test UI endpoint with root path
        run: |
          ROOT_PATH="${{ matrix.root_path }}"
          echo "Testing UI at: http://localhost:4000${ROOT_PATH}/ui/"

          for i in 1 2 3; do
            content=$(curl -sL --max-time 5 -H "Authorization: Bearer sk-1234" "http://localhost:4000${ROOT_PATH}/ui/")
            if echo "$content" | grep -q -E "(html|<!DOCTYPE|<head|<body)"; then
              echo "UI page contains valid HTML content"
              exit 0
            fi
            echo "Attempt $i/3 - no valid HTML, retrying in 5s..."
            sleep 5
          done
          echo "UI page does not contain expected HTML content"
          echo "Response: $content"
          docker logs litellm-test
          exit 1

      - name: Setup Node for Playwright
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Node 24.16.0 regressed stream destruction (nodejs/node#63487), which
          # deadlocks the yauzl-based extractor `playwright install` uses: the
          # browser zip downloads to 100% and extraction then hangs forever
          # (microsoft/playwright#41000). Playwright only worked around it in
          # 1.60.0 and tests/e2e/ui pins 1.58.1, so stay on the 22 LTS line. Do
          # not move this to 24 or 26 without first bumping @playwright/test to
          # >= 1.60.0
          node-version: "22"
          cache: "npm"
          # npm ci below runs in tests/e2e/ui, so key the cache off that
          # lockfile; the dashboard lockfile it used to point at is a different
          # dependency set and never produced a hit.
          cache-dependency-path: tests/e2e/ui/package-lock.json

      # Browser install is split from apt and bounded per attempt. The hang
      # this guards against is fixed above by the Node pin, but the guards stay:
      # a wedged `playwright install` otherwise burns the whole 30m job cap and
      # reports nothing, since the retry wrapper from #32406 cannot recover from
      # a hang (no attempt ever returns). `timeout` bounds each attempt so a
      # retry can take over, the step cap bounds the worst case, and
      # DEBUG=pw:install makes any recurrence name the step it stopped on.
      # 4 attempts x 75s plus backoff stays inside the 8m step cap.
      - name: Install e2e deps and Chromium
        working-directory: tests/e2e/ui
        timeout-minutes: 8
        env:
          DEBUG: pw:install
        run: |
          retry() {
            local attempt=1
            local max_attempts=4
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after $attempt attempts: $*"
                return 1
              fi
              echo "Attempt $attempt failed: $*. Retrying in $((attempt * 15))s..."
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          retry npm ci

          # install-deps is the apt half; keep it outside `timeout` so a SIGTERM
          # can never leave a half-applied dpkg state behind.
          retry npx playwright install-deps chromium
          # 4 attempts x 75s + backoff fits inside the 8m step cap above.
          retry timeout 75 npx playwright install chromium

      - name: Run SERVER_ROOT_PATH redirect e2e
        working-directory: tests/e2e/ui
        timeout-minutes: 5
        env:
          SERVER_ROOT_PATH: ${{ matrix.root_path }}
        run: npx playwright test --config=serverRootPath.config.ts

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-trace-${{ strategy.job-index }}
          path: tests/e2e/ui/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker stop litellm-test || true
          docker rm litellm-test || true
