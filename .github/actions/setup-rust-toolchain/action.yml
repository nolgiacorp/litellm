name: "Set up Rust toolchain"
description: >-
  Install (or update to) the latest stable Rust toolchain and make it the
  default. Installing this project with uv builds the litellm-rust python
  bridge through maturin, and the locked aws-sdk/aws-smithy crates already
  require a newer rustc than some runner images preinstall, so any job that
  installs the project must not rely on the image's default toolchain.
  Mirrors the toolchain setup in test-rust.yml.

runs:
  using: composite
  steps:
    - name: Install stable Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustc --version
